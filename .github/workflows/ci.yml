name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: TheSingularityWorkshop.ServerSC2
      - uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.ServerApp
          ref: development
          path: TheSingularityWorkshop.ServerApp
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build core
        working-directory: TheSingularityWorkshop.ServerSC2
        run: dotnet build src/ServerSC2.Core/ServerSC2.Core.csproj --configuration Release
      - name: Build ServerApp adapter
        working-directory: TheSingularityWorkshop.ServerSC2
        run: dotnet build src/ServerSC2.ServerAppAdapter/ServerSC2.ServerAppAdapter.csproj --configuration Release
      - name: Run contract checks
        working-directory: TheSingularityWorkshop.ServerSC2
        run: dotnet run --project tests/ServerSC2.ContractChecks/ServerSC2.ContractChecks.csproj --configuration Release
      - name: Upload contract check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-sc2-contract-check-results
          path: TheSingularityWorkshop.ServerSC2/contract-check-results.json
          if-no-files-found: error
          retention-days: 14
