name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: TheSingularityWorkshop.ServerSC2
      - uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.ServerApp
          ref: development
          path: TheSingularityWorkshop.ServerApp
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SC2 probe test dependencies
        working-directory: TheSingularityWorkshop.ServerSC2
        run: python -m pip install -r tools/sc2-probe/requirements.txt
      - name: Run SC2 probe preflight tests
        working-directory: TheSingularityWorkshop.ServerSC2
        run: python -m unittest discover -s tools/sc2-probe -p 'test_*.py'
      - name: Test contract TRX report adapter
        working-directory: TheSingularityWorkshop.ServerSC2
        run: python -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build core
        working-directory: TheSingularityWorkshop.ServerSC2
        run: dotnet build src/ServerSC2.Core/ServerSC2.Core.csproj --configuration Release
      - name: Build ServerApp adapter
        working-directory: TheSingularityWorkshop.ServerSC2
        run: dotnet build src/ServerSC2.ServerAppAdapter/ServerSC2.ServerAppAdapter.csproj --configuration Release
      - name: Run contract checks
        id: contract_checks
        working-directory: TheSingularityWorkshop.ServerSC2
        run: dotnet run --project tests/ServerSC2.ContractChecks/ServerSC2.ContractChecks.csproj --configuration Release
      - name: Convert contract check report to TRX
        if: always() && steps.contract_checks.outcome != 'skipped'
        working-directory: TheSingularityWorkshop.ServerSC2
        run: python tools/ci/contract_report_to_trx.py --input contract-check-results.json --output contract-check-results.trx
      - name: Upload contract check reports
        if: always() && steps.contract_checks.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: server-sc2-contract-check-results
          path: |
            TheSingularityWorkshop.ServerSC2/contract-check-results.json
            TheSingularityWorkshop.ServerSC2/contract-check-results.trx
          if-no-files-found: error
          retention-days: 14
